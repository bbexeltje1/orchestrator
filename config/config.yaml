# DRIFTLINE Orchestrator configuration.
# Secrets belong in .env (never here, never in Git, never in the ZIP).

project:
  name: DRIFTLINE
  repository: auto          # "auto" = search upward from base dir for .git
  default_branch: auto      # "auto" = main
  workspace_root: .

qwen:
  enabled: true
  provider: llama_cpp
  base_url: http://127.0.0.1:8090/v1
  model: auto               # discovered from /v1/models at runtime
  timeout: 60.0
  max_tokens: 4096

omniroute:
  enabled: false            # only used if a real chat route validates
  base_url: http://127.0.0.1:20128
  health_path: /health
  api_key_env: OMNIROUTE_API_KEY

thx:
  enabled: true
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: HAL-X/thx-02:q4_k_m
  decision_endpoint: /v1/systemone
  timeout: 60.0
  min_confidence: 0.55      # conservative; below this we escalate
  allow_fallback_chat: true

arena:
  enabled: true
  transport: auto           # auto | streamable_http | stdio
  # Your existing local bridge. The adapter discovers the real tool list and
  # schema from whatever this endpoint actually exposes.
  endpoint: http://127.0.0.1:17864/mcp
  stdio_command: ""         # e.g. "npx -y @modelcontextprotocol/server-..."
  task_tool: auto           # discovered from tools/list
  status_tool: auto
  result_tool: auto
  token_env: ARENA_BRIDGE_TOKEN
  request_timeout: 30.0
  poll_interval: 10.0
  poll_max: 120
  backoff_base: 2.0

# Official Claude Code CLI - the actual coding agent. The CLI uses YOUR
# subscription login (run "claude login"); DRIFTLINE never reads, stores or
# bypasses credentials. Execution happens only via the explicit
# claude-run / claude-acceptance commands.
claude_code:
  enabled: true
  command: claude         # executable name or full path
  timeout: 600.0          # per-task run timeout (seconds)
  probe_timeout: 90.0     # readiness probe timeout (seconds)
  model: ""               # optional --model override; empty = your default
  permission_mode: acceptEdits   # non-bypassing; edits work headlessly
  extra_args: ""          # optional extra CLI args (shell-safe tokens only)

workflow:
  autonomy: hybrid
  max_parallel_tasks: 1
  max_retries: 2
  dry_run: true             # true = never contact Arena until you disable it
  require_approval_for_merge: true
  require_approval_for_publish: true
  safe_idle_on_start: true
  poll_interval: 10.0

verification:
  run_git_checks: true
  run_tests: true
  run_rojo_build: false
  luau_lsp_command: ""
  roblox_studio_diagnostics: false

logging:
  level: INFO
  log_file: logs/orchestrator.log
  redact_secrets: true
  max_bytes: 5242880
  backup_count: 3

storage:
  database: data/orchestrator.db

# Background services managed by start.ps1 / play.cmd so nothing needs a
# separate terminal. A service whose start_command is empty is never started
# automatically. Commands run hidden in the background and are stopped again
# by .\stop.ps1 (only processes started here are ever stopped).
services:
  auto_start: true            # false = never start services, only probe them
  health_wait_seconds: 60     # how long to wait for a started service to answer
  ollama_start_command: ""    # empty = "<detected ollama> serve"
  qwen_start_command: ""      # e.g. llama-server -m C:\models\qwen.gguf --port 8090
  omniroute_start_command: ""
  arena_start_command: ""

server:
  bind_host: 127.0.0.1       # loopback only; never expose publicly
  port: 17870
  enabled: false
