[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftline-orchestrator"
version = "1.1.2"
description = "Hybrid-autonomy development orchestrator for the DRIFTLINE Roblox project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
driftline-orchestrator = "orchestrator.cli:main"

[tool.setuptools]
packages = [
    "orchestrator",
    "orchestrator.engines",
    "orchestrator.agents",
    "orchestrator.mcp",
    "orchestrator.verification",
    "orchestrator.storage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
